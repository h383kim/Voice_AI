[project]
name = "localvoicelab"
version = "0.1.0"
description = "Local-first, turn-based Voice AI agent (STT -> LLM -> TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "requests>=2.31",
    "pydantic>=2.6",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
